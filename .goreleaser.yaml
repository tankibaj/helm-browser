version: 2

builds:
  - main: .
    binary: helm-browser
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

brews:
  - name: helm-browser
    repository:
      owner: tankibaj
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/tankibaj/helm-browser
    description: Interactive terminal UI for browsing and downloading Helm chart values
    test: |
      assert_match version.to_s, shell_output("#{bin}/helm-browser --version")
